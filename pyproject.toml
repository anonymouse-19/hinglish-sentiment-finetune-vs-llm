[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-sentiment"
version = "0.1.0"
description = "Fine-tuned small models vs large LLMs on Hinglish sentiment: accuracy, latency and cost."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "huggingface_hub>=0.34",
    "ftfy>=6.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
