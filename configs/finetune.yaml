# Phase 3 fine-tuning. Choices explained in docs/DECISION_LOG.md (D-026 ... D-033).
# Every run: train on train, early-stop on val macro-F1. The best run per family (selected on val) is then
# scored once on test / YouTube with the same metrics code as the baselines.
seed: 42
max_length: 128          # covers ~all tweets (p99 = 52 tokens) and YouTube comments (p99 ~ 115)

tracking:
  report_to: wandb       # wandb | none   (owner's choice: W&B, D-027)
  project: hinglish-sentiment-finetune

models:                  # pinned to a commit for reproducibility
  xlmr:
    hf_id: FacebookAI/xlm-roberta-base
    revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
    licence: MIT
  muril:
    hf_id: google/muril-base-cased
    revision: afd9f36c7923d54e97903922ff1b260d091d202f
    licence: Apache-2.0
  qwen3_1p7b:
    hf_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    licence: Apache-2.0

# Option A: full fine-tuning of a multilingual encoder (HF Trainer, fp16 on a T4)
encoder:
  train:
    epochs: 4
    batch_size: 32
    weight_decay: 0.01
    warmup: 0.1          # fraction of total steps
    early_stopping_patience: 2
    fp16: true
  grid:                  # 3 model variants x 3 learning rates = 9 runs, ~4 min each on a T4
    model: [xlmr, muril, muril_demoji]
    learning_rate: [2.0e-5, 3.0e-5, 5.0e-5]
  variants:              # muril_demoji = MuRIL with emoji rewritten as text (its vocab has no emoji, D-029)
    xlmr: {model: xlmr, demojize: false}
    muril: {model: muril, demojize: false}
    muril_demoji: {model: muril, demojize: true}

# Option B: QLoRA on a small decoder -- 4-bit frozen base + trainable LoRA adapters + classification head
decoder:
  train:
    epochs: 2
    batch_size: 16
    weight_decay: 0.0
    warmup: 0.05
    early_stopping_patience: 1
    fp16: true           # T4 has no bf16
    gradient_checkpointing: true
  quantization: {load_in_4bit: true, bnb_4bit_quant_type: nf4, bnb_4bit_use_double_quant: true}
  lora:
    lora_alpha_over_r: 2         # alpha = 2r
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  grid:                  # 2 ranks x 2 learning rates = 4 runs, ~10-15 min each on a T4
    model: [qwen3_1p7b]
    lora_r: [8, 16]
    learning_rate: [1.0e-4, 2.0e-4]

latency:
  n_examples: 500        # single-example (batch 1) timing
  warmup: 20
  batch_size: 64         # throughput timing

# Tiny random models + a few dozen examples: checks the whole pipeline on a laptop CPU in ~1 minute.
smoke:
  n_train: 64
  n_eval: 32
  models:
    xlmr: optimum-intel-internal-testing/tiny-random-xlm-roberta
    muril: optimum-intel-internal-testing/tiny-random-xlm-roberta
    qwen3_1p7b: trl-internal-testing/tiny-Qwen3ForCausalLM

paths:
  processed_dir: data/processed
  output_root: outputs/finetune          # on Colab: a Google Drive folder (--output-root), survives disconnects
  report_dir: reports/finetune
