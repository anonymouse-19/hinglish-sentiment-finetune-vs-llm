# Phase 2 TF-IDF + logistic regression baseline. Choices explained in docs/DECISION_LOG.md (D-017).
seed: 42

# Small grid, selected on validation macro-F1. The test set is scored once, with the selected config.
grid:
  features: [word, char, word+char]
  C: [0.1, 0.3, 1.0, 3.0, 10.0]
  class_weight: [null, balanced]

latency:
  n_examples: 1000   # single-example predictions timed on CPU (batch size 1, like an online request)
  warmup: 50

paths:
  processed_dir: data/processed
  model_path: outputs/tfidf_lr/model.joblib
  report_dir: reports/baselines/tfidf
